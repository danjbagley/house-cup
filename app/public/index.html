<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The House Cup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --hall:#0C1226; --hall-2:#151E3D;
  --candle:#F0C45A; --candle-dim:#9C7A34; --ember:#FF9E3D;
  --parch:#EFE3C8; --parch-2:#DFCFA9; --parch-3:#C9B489;
  --ink:#2A2015; --ink-soft:#6E5D42;
  --gryf:#7C1420; --brass:#B9924F; --wax:#8E1B22;
  /* Starbucks green, two of them: #00704A is the brand green and clears AA on
     the parchment (4.83) but only manages 3.02 on the dark hall — too little
     for 9px letter-spaced type. The lighter accent reaches 6.00 there. */
  --sbux:#00704A; --sbux-lift:#00A862;
  --title:'Cinzel Decorative',Georgia,serif;
  --display:'Cinzel',Georgia,'Times New Roman',serif;
  --body:'EB Garamond',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--body);font-size:15px;line-height:1.55;
  background:var(--hall);color:var(--parch);min-height:100vh;padding-bottom:86px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:var(--body);font-size:16px}

.hall{position:relative;overflow:hidden;padding:24px 14px 22px;
  background:radial-gradient(130% 60% at 50% 0%,rgba(240,196,90,.14),transparent 62%),
    linear-gradient(180deg,#080D1C 0%,var(--hall) 34%,var(--hall-2) 100%);
  border-bottom:1px solid rgba(185,146,79,.3)}
#sky,#candles{position:absolute;inset:0;pointer-events:none}
.star{position:absolute;background:#fff;border-radius:50%;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.75}}
.shoot{position:absolute;top:11%;left:-10%;width:74px;height:1.5px;border-radius:2px;
  background:linear-gradient(90deg,rgba(255,255,255,0),#FFF6DC 55%,rgba(255,255,255,0));
  opacity:0;transform:rotate(9deg);animation:shoot 11s ease-in 5s infinite;pointer-events:none}
@keyframes shoot{0%,93%{opacity:0;transform:translate(0,0) rotate(9deg)}
  94%{opacity:.85}100%{opacity:0;transform:translate(115vw,10vh) rotate(9deg)}}
.cdl{position:absolute;width:7px;animation:float 7s ease-in-out infinite}
.cdl .stick{width:7px;border-radius:2px;background:linear-gradient(180deg,#F4EEDC,#C9BC9A);box-shadow:0 0 8px rgba(240,196,90,.25)}
.cdl .flame{width:7px;height:11px;margin:0 auto 1px;border-radius:50% 50% 45% 45%;
  background:radial-gradient(circle at 50% 70%,#FFF3C4,var(--ember) 55%,rgba(255,158,61,0) 78%);
  animation:flick 1.7s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes flick{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.18) scaleX(.9)}}
.hall-in{position:relative;z-index:2}
.eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:.28em;text-transform:uppercase;
  color:var(--candle-dim);margin:0 0 7px;text-align:center}
.eyebrow.brand{color:var(--sbux-lift)}
h1{font-family:var(--title);font-weight:700;font-size:22px;line-height:1.15;margin:0;
  color:var(--candle);text-align:center;text-shadow:0 0 22px rgba(240,196,90,.35)}
.rule{display:flex;align-items:center;justify-content:center;gap:9px;margin:8px 0 2px;color:var(--candle-dim);font-size:9px}
.rule:before,.rule:after{content:'';height:1px;width:44px;background:linear-gradient(90deg,transparent,rgba(185,146,79,.75),transparent)}
.storeline{font-size:13px;color:rgba(239,227,200,.55);margin:6px 0 0;text-align:center;font-style:italic}
.storeline input{background:none;border:none;border-bottom:1px dotted rgba(185,146,79,.55);
  color:rgba(239,227,200,.8);font-size:13px;font-style:italic;padding:1px 2px;width:8.5em;text-align:center}
.storeline input:focus{outline:none;border-bottom-color:var(--candle)}
.who{text-align:center;margin-top:10px}
.who button{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--candle-dim);border:1px solid rgba(185,146,79,.4);border-radius:99px;padding:5px 13px}
.who button.on{color:var(--candle);border-color:rgba(240,196,90,.7)}

.glasses{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:16px}
.glass{text-align:center;position:relative}
.glass .crest{height:21px;margin-bottom:2px}
.glass svg.hg{width:100%;height:auto;max-height:196px;display:block}
.leading .hg{animation:leadglow 3.4s ease-in-out infinite}
@keyframes leadglow{0%,100%{filter:drop-shadow(0 0 8px rgba(240,196,90,.32))}
  50%{filter:drop-shadow(0 0 17px rgba(240,196,90,.6))}}
.gname{font-family:var(--display);font-size:9px;letter-spacing:.05em;font-weight:600;
  margin-top:5px;color:rgba(239,227,200,.82);text-transform:uppercase}
@media(min-width:500px){.gname{font-size:12px}.glasses{gap:10px}}
.gpts{font-family:var(--mono);font-size:17px;font-weight:600;margin-top:1px}
.gsub{font-family:var(--mono);font-size:8px;color:rgba(239,227,200,.42)}
.fill-rect{transition:y 1s cubic-bezier(.2,.7,.3,1),height 1s cubic-bezier(.2,.7,.3,1)}
.spk{animation:spk 3.4s ease-in-out infinite}
@keyframes spk{0%,100%{opacity:0}12%{opacity:0}50%{opacity:.85}88%{opacity:0}}
.pour{opacity:0}
.pouring .pour{animation:drop 1.05s ease-in forwards}
.gain{position:absolute;top:30px;left:0;right:0;text-align:center;font-family:var(--mono);
  font-weight:600;font-size:14px;color:var(--candle);opacity:0;pointer-events:none;
  text-shadow:0 1px 6px rgba(0,0,0,.65);animation:gainrise 1.5s ease-out forwards}
@keyframes gainrise{0%{opacity:0;transform:translateY(10px)}18%{opacity:1}72%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
@keyframes drop{0%{opacity:1;transform:translateY(0)}86%{opacity:1}100%{opacity:0;transform:translateY(58px)}}
@media(prefers-reduced-motion:reduce){.fill-rect{transition:none}.pouring .pour{animation:none}
  .gain{display:none}.shoot{display:none}.spk{animation:none;opacity:.35}
  .sash,.sash-in{animation:none}
  #gate.err input,#gate .g-reveal,#gate.leaving{animation:none}
  .leading .hg{animation:none;filter:drop-shadow(0 0 12px rgba(240,196,90,.45))}
  .star,.cdl,.flame{animation:none!important}}

.sheet{position:relative;color:var(--ink);padding:24px 17px 30px;min-height:62vh;
  background:radial-gradient(80% 40% at 10% 0%,rgba(201,180,137,.35),transparent 55%),
    radial-gradient(70% 45% at 95% 30%,rgba(201,180,137,.28),transparent 55%),
    linear-gradient(178deg,var(--parch),#E7DABC 55%,var(--parch))}
.sash{margin:-6px -17px 18px;padding:11px 14px;text-align:center;position:relative;overflow:hidden;
  background:linear-gradient(100deg,#8A6A26,#D9B95E 30%,#F4E3AE 50%,#D9B95E 70%,#8A6A26);
  background-size:220% 100%;color:#2A2015;font-family:var(--display);font-weight:700;
  font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  box-shadow:0 2px 8px rgba(0,0,0,.18);animation:sashsheen 4s linear infinite}
.sash-in{animation:sashin .8s cubic-bezier(.2,.7,.3,1),sashsheen 4s linear .8s infinite}
@keyframes sashin{0%{transform:translateX(-104%)}100%{transform:translateX(0)}}
@keyframes sashsheen{0%{background-position:0 0}100%{background-position:220% 0}}
.sheet:before{content:'';position:absolute;top:0;left:0;right:0;height:7px;
  background:repeating-linear-gradient(90deg,var(--parch) 0 7px,transparent 7px 11px)}
.sheet h2{font-family:var(--display);font-size:14px;letter-spacing:.14em;text-transform:uppercase;
  margin:0 0 5px;font-weight:700;display:flex;align-items:center;gap:9px}
.sheet h2:after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--parch-3),transparent)}
.hint{font-size:14px;color:var(--ink-soft);margin:0 0 17px;font-style:italic;line-height:1.5}
.card{background:rgba(255,252,244,.55);border:1px solid var(--parch-3);border-radius:3px;
  padding:15px;margin-bottom:13px;box-shadow:0 1px 0 rgba(255,255,255,.6) inset}
label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-soft);margin:0 0 6px}
.field{margin-bottom:15px}
select,input[type=text],input[type=date],input[type=number],input[type=password],textarea{
  width:100%;padding:11px 12px;border:1px solid var(--parch-3);border-radius:3px;
  background:#FFFCF4;color:var(--ink);font-family:var(--body);font-size:16px}
textarea{line-height:1.5;resize:vertical}
select:focus,input:focus,textarea:focus{outline:2px solid var(--candle-dim);outline-offset:1px}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;
  min-height:46px;text-align:left;line-height:1.3}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:46px;height:46px;border-radius:3px;background:#FFFCF4;
  border:1px solid var(--parch-3);font-size:21px;font-family:var(--display);color:var(--ink);flex:0 0 auto}
.stepper .val{flex:1;text-align:center;font-family:var(--mono);font-size:23px;font-weight:600}
.btn{display:block;width:100%;padding:14px;border-radius:3px;background:var(--ink);color:var(--parch);
  font-family:var(--display);font-size:12px;letter-spacing:.15em;text-transform:uppercase;font-weight:600}
.btn:disabled{opacity:.32}
.btn.ghost{background:none;border:1px solid var(--parch-3);color:var(--ink-soft);font-size:10.5px;padding:12px}
.btn.danger{background:none;border:1px solid rgba(124,20,32,.45);color:var(--gryf);font-size:10.5px;padding:12px}
.row{display:flex;gap:9px}
.row>*{flex:1}
.seg{display:flex;border:1px solid var(--parch-3);border-radius:3px;overflow:hidden;margin-bottom:15px}
.seg button{flex:1;padding:10px 3px;font-family:var(--display);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-soft)}
.seg button.on{background:var(--ink);color:var(--parch)}
.tgt{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--parch-3);cursor:pointer}
.tgt:first-of-type{border-top:none}
.tgt:focus-visible{outline:2px solid var(--candle-dim);outline-offset:2px}
.tgt .box{width:26px;height:26px;flex:0 0 26px;border:1.5px solid var(--parch-3);border-radius:3px;
  background:#FFFCF4;display:flex;align-items:center;justify-content:center;font-size:16px;color:transparent}
.tgt.on .box{background:#1E5C3A;border-color:#1E5C3A;color:#fff}
.tgt .lb{flex:1}
.tgt .lb b{font-weight:600}
.tgt .lb i{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-soft);font-style:normal;margin-top:1px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-soft);text-align:left;padding:0 5px 8px;font-weight:500}
td{padding:9px 5px;border-top:1px solid var(--parch-3);vertical-align:middle}
td.num{font-family:var(--mono);text-align:right;font-weight:600;font-size:13px}
.crest-sm{vertical-align:-3px;margin-right:6px}
.x{color:var(--ink-soft);font-size:18px;padding:2px 6px;line-height:1}
.by{font-family:var(--mono);font-size:9px;color:var(--ink-soft);letter-spacing:.05em}
.bar{height:6px;background:var(--parch-2);border-radius:3px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;transition:width .7s ease}
.prog-row{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;margin-top:13px}
.prog-row span:last-child{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft)}
.empty{text-align:center;padding:34px 16px;color:var(--ink-soft);font-size:14.5px;
  font-style:italic;line-height:1.65;border:1px dashed var(--parch-3);border-radius:3px}
.note{font-size:12.5px;color:var(--ink-soft);font-style:italic;line-height:1.5;margin-top:15px}
.quiet{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-soft);opacity:.8;border-bottom:1px dotted var(--parch-3);padding:2px 1px}
.quiet:active{opacity:1}
.seal{width:54px;height:54px;margin:26px auto 0;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#B8323A,var(--wax) 60%,#5E1015);
  display:flex;align-items:center;justify-content:center;font-family:var(--title);
  font-size:19px;color:rgba(255,225,225,.72);box-shadow:0 2px 5px rgba(0,0,0,.25);transform:rotate(-7deg)}
.lock{text-align:center;padding:8px 0 4px}
.lock .ico{font-size:30px;color:var(--parch-3);line-height:1}
.wk{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--parch-3)}
.wk .nm{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk input{width:62px;flex:0 0 62px;padding:8px 6px;text-align:center;font-family:var(--mono);font-size:15px}
.prow{padding:12px 0;border-top:1px solid var(--parch-3)}
.prow:first-child{border-top:none}
.prow.dim{opacity:.55}
.pname{font-size:14.5px;margin-bottom:8px;display:flex;align-items:center;gap:2px}
.pctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pctl select{width:auto;flex:0 0 auto;padding:7px 8px;font-size:12.5px;max-width:44vw}
.tgl{padding:7px 12px;border:1px solid var(--parch-3);border-radius:99px;background:#FFFCF4;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-soft)}
.tgl.on{background:var(--ink);color:var(--parch);border-color:var(--ink)}
.tgl.del{border-color:rgba(124,20,32,.32);color:var(--gryf)}
.undobar{width:100%;padding:12px;margin-bottom:15px;border-radius:3px;
  border:1px solid var(--parch-3);background:rgba(255,252,244,.7);color:var(--ink);
  font-family:var(--display);font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:600}
.chip{display:inline-block;padding:5px 12px;margin:0 5px 6px 0;border-radius:99px;
  border:1px solid var(--parch-3);background:#FFFCF4;font-size:13.5px;line-height:1.3}
.hcard{margin-bottom:16px}
.hcard .hh{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:12px;
  letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:8px}
.hcard .hh em{margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
  font-style:normal;color:var(--ink-soft);text-transform:none}
.hgroup{font-family:var(--display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  font-weight:700;margin:16px 0 2px;display:flex;align-items:center;gap:7px}

nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(8,13,28,.97);
  backdrop-filter:blur(9px);border-top:1px solid rgba(185,146,79,.32);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:12px 1px 13px;font-family:var(--display);font-size:9px;
  letter-spacing:.09em;text-transform:uppercase;color:rgba(239,227,200,.4);
  border-top:2px solid transparent;margin-top:-1px}
nav button[aria-current=true]{color:var(--candle);border-top-color:var(--candle)}
#gate{display:none;position:fixed;inset:0;z-index:70;flex-direction:column;align-items:center;justify-content:center;padding:26px;
  background:radial-gradient(130% 60% at 50% 0%,rgba(240,196,90,.13),transparent 62%),
    linear-gradient(180deg,#080D1C,#0C1226 40%,#151E3D)}
#gate .g-title{font-family:var(--title);color:var(--candle);font-size:26px;margin:0 0 6px;text-align:center;
  text-shadow:0 0 22px rgba(240,196,90,.35)}
#gate .g-sub{font-family:var(--mono);font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--candle-dim);margin:0 0 26px;text-align:center}
#gate input{width:158px;text-align:center;font-family:var(--mono);font-size:24px;letter-spacing:.35em;
  background:rgba(255,252,244,.06);border:1px solid rgba(185,146,79,.5);color:var(--parch);border-radius:3px;padding:12px 4px}
#gate input:focus{outline:2px solid var(--candle-dim)}
#gate .g-btn{margin-top:18px;padding:12px 36px;border:1px solid rgba(240,196,90,.7);border-radius:99px;
  color:var(--candle);font-family:var(--display);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
#gate.err input{animation:gshake .35s}
@keyframes gshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#gate .g-reveal{text-align:center;animation:grevin .6s ease-out}
@keyframes grevin{0%{opacity:0;transform:scale(.86)}100%{opacity:1;transform:scale(1)}}
#gate.leaving{animation:gfade .5s ease forwards}
@keyframes gfade{100%{opacity:0}}
#ask{display:none;position:fixed;inset:0;z-index:80;background:rgba(8,13,28,.62);
  align-items:center;justify-content:center;padding:22px}
.ask-card{background:var(--parch);color:var(--ink);border-radius:4px;max-width:340px;width:100%;
  padding:20px 18px;box-shadow:0 12px 40px rgba(0,0,0,.5);font-size:15px;line-height:1.55;font-family:var(--body)}
.ask-card p{margin:0 0 16px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(12px);
  background:#0C1226;border:1px solid rgba(185,146,79,.55);color:var(--candle);
  padding:11px 20px;border-radius:2px;font-family:var(--display);font-size:13px;
  opacity:0;pointer-events:none;transition:all .3s ease;z-index:20;
  box-shadow:0 6px 26px rgba(0,0,0,.5);max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .undo{margin-left:12px;padding:4px 12px;border:1px solid var(--candle);border-radius:99px;
  font-family:var(--display);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--candle)}
.toast .undo:active{background:var(--candle);color:#0C1226}
#cert{display:none;position:fixed;inset:0;z-index:60;background:#fff;color:#000;
  overflow:auto;padding:14px 14px 40px}
#certbar{display:flex;gap:10px;justify-content:flex-end;margin-bottom:14px}
.cert-page{max-width:640px;margin:0 auto;background:#fff}
.cert-frame{border:3px double #000;padding:38px 26px 28px;text-align:center;
  font-family:var(--body);color:#000}
.cert-kick{font-family:var(--mono);font-size:10px;letter-spacing:.34em;text-transform:uppercase}
.cert-crest{margin:22px 0 16px}
.cert-sub{font-family:var(--display);font-size:12px;letter-spacing:.3em;text-transform:uppercase}
.cert-house{font-family:var(--title);font-size:40px;line-height:1.1;margin:10px 0 4px;text-transform:uppercase}
.cert-dates{font-size:17px;font-style:italic;margin-bottom:20px}
.cert-score{font-family:var(--mono);font-size:13px;letter-spacing:.08em;
  border-top:1px solid #000;border-bottom:1px solid #000;padding:11px 0;margin-bottom:20px}
.cert-names{font-size:17px;line-height:2;max-width:30em;margin:0 auto 22px}
.cert-rest{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:30px}
.cert-sign{display:flex;gap:34px;justify-content:center;font-family:var(--mono);
  font-size:9px;letter-spacing:.18em;text-transform:uppercase}
.cert-sign div{flex:1;max-width:190px}
.cert-sign i{display:block;border-bottom:1px solid #000;height:32px;margin-bottom:5px}
@media print{
  @page{size:A4 portrait;margin:16mm}
  body{background:#fff;padding:0}
  .hall,nav,.sheet,.toast,#ask,#gate{display:none!important}
  #cert{position:static;display:block!important;padding:0;overflow:visible}
  #certbar{display:none!important}
  .cert-frame{border-color:#000;padding:46px 34px 34px}
}
.loading{padding:60px 20px;text-align:center;color:var(--candle-dim);font-family:var(--display);font-size:13px}
</style>
</head>
<body>

<div class="hall">
  <div id="sky"></div><div id="candles"></div>
  <div class="hall-in">
    <p class="eyebrow brand" id="eyebrow">Starbucks</p>
    <h1>The House Cup</h1>

/* ---- self-hosted storage adapter ----
   Same contract as Claude-artifact storage; the rest of the app is untouched.
   GET  api/state -> 200 {json} | 204 empty (fresh board)
   PUT  api/state -> 204                                            */
window.storage={
  async get(key,shared){
    const r=await fetch('api/state',{cache:'no-store'});
    /* 204 means the server is fine and the board is genuinely empty; anything
       else (or a thrown fetch) means we could not read it. Telling those apart
       is what lets save() refuse to write over a board it never managed to
       read, without blocking a real first run. */
    if(r.status===204){const e=new Error('fresh board');e.fresh=true;throw e}
    if(r.status!==200)throw new Error('server said '+r.status);
    const v=await r.text();
    if(!v)throw new Error('empty state');
    return {value:v,key:key,shared:!!shared}},
  async set(key,val,shared){
    const r=await fetch('api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:val});
    if(!r.ok)throw new Error('save failed');
    return {key:key,value:val,shared:!!shared}}};
</script>

function freshState(){
  return JSON.parse(JSON.stringify(Object.assign({},DEFAULT,
    {managers:SEED_MGRS,roster:SEED_ROSTER,cupStart:todayISO()})))}
async function load(){
  const r=await readState(3);
  if(r.ok){S=Object.assign(freshState(),r.value);lastRaw=r.raw;loadedOk=true}
  else if(r.fresh){S=freshState();loadedOk=true}   /* server fine, board empty */
  else{S=freshState();loadFailed=true}             /* could not read — block saves */
  if(!S.days)S.days=[];
  if(!Array.isArray(S.extras))S.extras=JSON.parse(JSON.stringify(DEFAULT_EXTRAS));
  if(!Array.isArray(S.misdeeds))S.misdeeds=JSON.parse(JSON.stringify(DEFAULT_MISDEEDS));
  if(!Array.isArray(S.targets))S.targets=JSON.parse(JSON.stringify(DEFAULT_TARGETS));
  if(!S.storeHitPoints)S.storeHitPoints=10;
  if(!S.managers)S.managers=[];
  if(!S.roster)S.roster=[];
  const _del=S.deleted||[];
  const _has=(list,full)=>{const f=full.split(' ')[0].toLowerCase();
    return list.some(x=>{const n=(x.name||'').trim().toLowerCase();
      return n===full.toLowerCase()||n===f})};
  SEED_MGRS.forEach(sm=>{
    if(_del.indexOf(sm.id)>=0||_has(S.managers,sm.name))return;
    S.managers.push(Object.assign({},sm))});

    if(_del.indexOf(sp.id)>=0||_has(S.roster,sp.name))return;
    S.roster.push(Object.assign({},sp))});

let saving=false,lastRaw=null,roseOnce=false;
/* loadedOk: a read has succeeded, so we know what is on the board and it is
   safe to write. Until then save() refuses — otherwise a failed read at load
   followed by one at save writes an empty board over a real one. */
let loadedOk=false,loadFailed=false,pending=false,pendingReplace=false;
const TOMB_CAP=5000;
function tomb(ids){
  /* was capped at 800 and kept the newest — but resetAll and closeCup concat
     entries first, so entries were what fell off, letting a phone that had
     been offline resurrect a finished term */
  const seen={},out=[];
  (S.deleted||[]).concat(ids.filter(Boolean)).forEach(id=>{if(!seen[id]){seen[id]=1;out.push(id)}});
  S.deleted=out.length>TOMB_CAP?out.slice(-TOMB_CAP):out}
/* ids on the remote board but absent from `loc` — what a replacing write
   (restore) must tombstone so other clients do not merge them back */
function absentIds(rem,loc){
  const out=[];
  ['entries','days','roster','managers','archive'].forEach(k=>{
    const have={};(loc[k]||[]).forEach(x=>{if(x&&x.id)have[x.id]=1});
    (rem[k]||[]).forEach(x=>{if(x&&x.id&&!have[x.id])out.push(x.id)})});
  return out}
async function readState(tries){
  for(let i=0;i<tries;i++){
    try{const r=await window.storage.get(KEY,true);return {ok:true,raw:r.value,value:JSON.parse(r.value)}}
    catch(e){if(e&&e.fresh)return {ok:false,fresh:true};
      if(i+1<tries)await new Promise(f=>setTimeout(f,300*(i+1)))}}
  return {ok:false}}
function mergeById(a,b,del){
  const m={};
  (b||[]).forEach(x=>{if(x&&x.id)m[x.id]=x});
  (a||[]).forEach(x=>{if(x&&x.id)m[x.id]=x});
  return Object.keys(m).filter(k=>del.indexOf(k)<0).map(k=>m[k])}
function mergeState(loc,rem){
  const del=[];
  (loc.deleted||[]).concat(rem.deleted||[]).forEach(i=>{if(del.indexOf(i)<0)del.push(i)});
  const out=Object.assign({},rem,loc);
  out.deleted=del.slice(-TOMB_CAP);
  out.entries=mergeById(loc.entries,rem.entries,del);
  out.days=mergeById(loc.days,rem.days,del);
  out.roster=mergeById(loc.roster,rem.roster,del);
  out.managers=mergeById(loc.managers,rem.managers,del);
  out.archive=mergeById(loc.archive,rem.archive,del);
  return out}
async function save(replace){
  /* 9: a save arriving mid-save used to be dropped — it is queued now */
  if(saving){pending=true;if(replace)pendingReplace=true;return}
  saving=true;
  try{
    const r=await readState(2);
    if(r.ok){loadedOk=true;loadFailed=false;
      /* 2: a restore must replace, not union with what is already there */
      if(replace)tomb(absentIds(r.value,S));else S=mergeState(S,r.value)}
    else if(r.fresh){loadedOk=true;loadFailed=false}
    else if(!loadedOk){
      /* 8: never read the board — writing now could erase it */
      loadFailed=true;toast('Cannot reach the board — nothing was saved');
      saving=false;flush();render();return}
    lastRaw=JSON.stringify(S);
    await window.storage.set(KEY,lastRaw,true);
  }catch(e){toast("The owl didn't get through")}
  saving=false;flush()}
function flush(){
  if(!pending)return;
  const r=pendingReplace;pending=false;pendingReplace=false;save(r)}

async function poll(){

function gateNeeded(){return !me&&!unlocked&&!!(S&&S.posterPin)}

/* ---------- scoring ---------- */
function shortName(p){
  const parts=String(p.name).trim().split(/\s+/),f=parts[0];
  if(!parts[1])return f;
  const pool=S.roster.concat(S.managers||[]);
  const twin=pool.filter(x=>{
    const q=String(x.name).trim().split(/\s+/);
    return q[0].toLowerCase()===f.toLowerCase()&&q[1]&&q[1][0].toLowerCase()===parts[1][0].toLowerCase()}).length>1;
  return twin?f+' '+parts[1]:f+' '+parts[1][0]+'.'}
function mondayOf(iso){const d=new Date(iso+'T00:00:00');
  d.setDate(d.getDate()-((d.getDay()+6)%7));
  return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function addDays(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);
  return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function fmtLong(iso){try{return new Date(iso+'T00:00:00')
  .toLocaleDateString('en-GB',{day:'numeric',month:'long'})}catch(e){return iso}}
function weekStats(start){
  const end=addDays(start,6),st={};
  HOUSES.forEach(h=>st[h.id]={id:h.id,raw:0,smg:0,extra:0,tgt:0,members:0,pts:0});
  S.roster.forEach(p=>{if(st[p.house])st[p.house].members++});
  S.entries.forEach(e=>{if(e.date<start||e.date>end)return;const x=st[houseSlot(e.house)];if(!x)return;
    x.raw+=entryPts(e);x.smg+=e.smg||0;x.extra+=e.extra||0});
  S.days.forEach(d=>{if(d.date<start||d.date>end)return;const x=st[houseSlot(d.house)];if(!x)return;
    x.tgt+=targetsList().filter(t=>d[t.k]).length});
  HOUSES.forEach(h=>{const x=st[h.id];
    x.pts=x.tgt*S.storeHitPoints+(S.perCapita&&x.members?Math.round(x.raw/x.members*10)/10:x.raw)});
  return {start,end,list:HOUSES.map(h=>st[h.id]).sort((a,b)=>b.pts-a.pts)}}

  const set={};

function houseStats(){
  /* 12: was the only date computed in UTC, and measuring 6.5 days back from
     the current instant made the window 7 or 8 days wide depending on the
     time of day it was read. Today plus the six before it. */
  const wk=addDays(todayISO(),-6),st={};
  HOUSES.forEach(h=>st[h.id]={id:h.id,raw:0,smg:0,extra:0,tgt:0,week:0,members:0,pts:0});
  S.roster.forEach(p=>{if(st[p.house])st[p.house].members++});
  S.entries.forEach(e=>{const s=st[houseSlot(e.house)];if(!s)return;
    const v=entryPts(e);s.raw+=v;s.smg+=(e.smg||0);s.extra+=(e.extra||0);if(e.date>=wk)s.week+=v});
  S.days.forEach(d=>{const s=st[houseSlot(d.house)];if(!s)return;
    s.tgt+=targetsList().filter(t=>d[t.k]).length});
  const svy=surveyReached()?(S.smgReward||0):0;
  HOUSES.forEach(h=>{const s=st[h.id];
    s.pts=svy+s.tgt*S.storeHitPoints+(S.perCapita&&s.members?Math.round(s.raw/s.members*10)/10:s.raw)});
  const a=HOUSES.map(h=>st[h.id]).sort((x,y)=>y.pts-x.pts);
  a.forEach((s,i)=>{s.rank=i>0&&a[i-1].pts===s.pts?a[i-1].rank:i+1});
  return st}

      </defs>

      <circle cx="22" cy="7" r="3.4" fill="url(#brs-${q})"/><circle cx="78" cy="7" r="3.4" fill="url(#brs-${q})"/>
      <g clip-path="url(#bulb-${q})"><rect x="19" y="15" width="62" height="70" fill="url(#gr-${q})"/></g>

      <path d="M57 80 L74 74 L59 86 Z" fill="url(#brs-${q})"/>

      <g clip-path="url(#cyl-${q})">
        <rect class="fill-rect" x="21" y="${y0}" width="58" height="${232-y0}" data-y="${y.toFixed(1)}"

        ${[[33,224,1.4],[62,214,1.1],[47,228,1.2],[70,222,1],[38,204,1.1],[57,196,1.3],[28,186,1],[66,176,1.2],[44,166,1.1],[35,146,1]]
          .filter(sp=>sp[1]>y+8).map((sp,si)=>`<circle class="spk" cx="${sp[0]}" cy="${sp[1]}" r="${sp[2]}" fill="#FFF" opacity="0"
            style="animation-delay:${(1.6+si*.7+gi*.3).toFixed(1)}s"/>`).join('')}

function reducedMotion(){return !!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)}
function pour(id,amt){const el=document.getElementById('glass-'+slug(id));if(!el)return;
  el.classList.remove('pouring');void el.offsetWidth;el.classList.add('pouring');
  if(amt&&!reducedMotion()){
    const g=document.createElement('div');g.className='gain';g.textContent='+'+n1(amt);
    el.appendChild(g);setTimeout(()=>{try{g.remove()}catch(e){}},1600)}

/* ---------- roles ---------- */
function canEdit(){return !!me}
function isSuper(m){return !!m&&m.role==='super'}
function isAdmin(m){return !!m&&m.role==='admin'}
function superSet(){return S.managers.some(isSuper)}
function canManage(){return !S.managers.some(m=>m.pin||m.pw)||(!!me&&(isSuper(me)||isAdmin(me)||!superSet()))}
function undoBar(){return undoSnap?`<button class="undobar" onclick="doUndo()">↩ Undo last change</button>`:''}
function whoBar(){document.getElementById('who').innerHTML=me
  ? `<button class="on" onclick="signOut()">${esc(me.name)} — sign out</button>`
  : ``}
function signOut(){me=null;tab='hall';toast('Signed out');render()}
async function matchPw(m,v){
  if(!m||!v)return false;
  try{if(m.pw&&(await sha256(v))===m.pw)return true}catch(e){}
  return !!(m.pin&&m.pin===v)}
async function trySignIn(){
  const id=((document.getElementById('who2')||{}).value)||'';
  const v=((document.getElementById('pw')||{}).value)||'';
  if(!v){toast('Choose your name and enter your password');return}
  const m=S.managers.find(x=>x.id===id);
  let who=null;
  if(await matchPw(m,v))who=m;
  /* admin is not offered in the list — it is a maintenance account, not one
     of the store's managers. Its password still signs it in from whatever
     name is selected, so the way back in when the store manager is locked
     out (see the handover) survives without advertising the account. */
  if(!who){
    const a=S.managers.find(x=>isAdmin(x));
    if(await matchPw(a,v))who=a}
  if(!who){toast('That password is not recognised');return}
  me=who;unlocked=true;tab='log';toast('Welcome, '+who.name);render()}
function lockPanel(what){
  if(!S.managers.some(m=>m.pin||m.pw))return `<h2>Set up the managers</h2>
    <p class="hint">Give each manager a password of their own, and tap the star to name the store manager — from then on, only they can change passwords or manager access. As soon as anyone has a password, this page locks.</p>
    ${mgrList()}${mgrForm()}
    <p class="note">A courtesy lock, not real security. Invent a password for this — never one you use anywhere else.</p>`;
  return `<h2>${what}</h2><p class="hint">Managers only. Baristas can see everything on the poster without signing in.</p>
  <div class="card"><div class="lock"><div class="ico">✧</div></div>
    <div class="field" style="margin-top:12px"><label>Your name</label>
      <select id="who2">${S.managers.filter(m=>!isAdmin(m)).map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></div>
    <div class="field"><label>Password</label>
      <input type="password" id="pw" autocomplete="off" placeholder="••••••" onkeydown="if(event.key==='Enter')trySignIn()"></div>
    <button class="btn" onclick="trySignIn()">Sign in</button></div>
  <p class="note">Forgotten your password? The store manager can read it out or set you a new one. A courtesy lock, not real security — use a password invented for this and nothing else, never one from anywhere real.</p>`}
function mgrList(){
  if(!S.managers.length)return '<div class="empty">No managers yet.</div>';
  if(!canManage())return `<div class="card" style="padding:10px 13px">
    ${S.managers.filter(m=>!isAdmin(m)).map(m=>`<div class="wk"><span class="nm">${esc(m.name)}</span>
      ${isSuper(m)?'<span class="by" style="flex:0 0 auto">★ store manager</span>':''}</div>`).join('')}</div>`;
  return `<div class="card" style="padding:10px 13px">
    <div class="wkhead" style="display:flex;gap:6px;padding-bottom:5px">
      <span class="nm" style="flex:1"></span>
      <span style="flex:0 0 26px;text-align:center;font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft)">SM</span>
      <span style="flex:0 0 96px;text-align:center;font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)">Password</span>
      <span style="flex:0 0 26px"></span></div>
    ${/* admin is a maintenance account with full powers, not one of the
          store's managers, so it is not listed as one. It stays selectable
          on the sign-in screen: the handover makes it the way back in when
          the store manager is locked out, so hiding it there would remove
          the only recovery route. Still unremovable, still ⚙ elsewhere. */
      S.managers.filter(m=>!isAdmin(m)).map(m=>`<div class="wk" style="gap:6px">
      <span class="nm">${esc(m.name)}</span>
      ${isSuper(m)
        ?`<span style="flex:0 0 26px;text-align:center;color:var(--candle-dim);font-size:15px;line-height:1" title="Store manager" aria-label="Store manager">★</span>`
        :`<button class="x" style="flex:0 0 26px;color:var(--ink-soft)" onclick="makeSuper('${m.id}')" aria-label="Make ${esc(m.name)} the store manager" title="Make store manager">☆</button>`}
      <input type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
        value="${esc(m.pin||'')}" placeholder="${m.pw?'set — retype to show':'none'}"
        style="flex:0 0 96px;padding:7px 4px;text-align:center;font-family:var(--mono);font-size:12px"
        onchange="setMgrPw('${m.id}',this.value)">
      <button class="x" style="flex:0 0 26px" onclick="delMgr('${m.id}')" aria-label="Remove">×</button></div>`).join('')}</div>`}
function makeSuper(id){
  if(!canManage())return;
  const m=S.managers.find(x=>x.id===id);if(!m||isSuper(m)||isAdmin(m))return;
  askConfirm('Make '+m.name+' the store manager? Only they will be able to change passwords and manager access.',()=>{
    S.managers.forEach(x=>{if(x.role==='super')x.role=''});
    m.role='super';if(me&&me.id===m.id)me=m;
    save();render();toast(m.name+' is now the store manager')})}
function setMgrPw(id,v){
  if(!canManage()){toast('Only the store manager can change this');render();return}
  const m=S.managers.find(x=>x.id===id);if(!m)return;
  v=v.trim();if(!v)return;
  m.pin=v;m.pw='';
  if(me&&me.id===id)me=m;
  save();render();toast(m.name+' can sign in with that password')}
function mgrForm(){return `<div class="card">
  <div class="field" style="margin-bottom:9px"><label>Add another manager</label>
    <input type="text" id="mName" placeholder="Name" onkeydown="if(event.key==='Enter')addMgr()"></div>
  <button class="btn ghost" onclick="addMgr()">Add</button></div>`}
function addMgr(){
  if(!canManage())return;
  const el=document.getElementById('mName'),n=el.value.trim();
  if(!n){el.focus();return}
  if(S.managers.some(m=>m.name.toLowerCase()===n.toLowerCase())){toast('Already listed');return}
  S.managers.push({id:uid(),name:n,house:'',pin:'',pw:'',role:''});
  save();render();toast(n+' added — set them a password')}
function delMgr(id){if(!canManage())return;
  const m=S.managers.find(x=>x.id===id);if(!m)return;
  if(isSuper(m)){toast('Name another store manager first');return}
  if(isAdmin(m)){toast('The admin account is for maintenance and cannot be removed');return}
  if(S.managers.length===1){toast('Keep at least one manager');return}
  askConfirm('Remove '+m.name+"'s access?",()=>{
    snap();tomb([id]);S.managers=S.managers.filter(x=>x.id!==id);if(me&&me.id===id)me=null;save();render();toast(m.name+' removed',1)})}

function openCert(start){certWeek=start;renderCert()}

function renderCert(){
  const w=weekStats(certWeek),win=w.list[0],h=house(win.id);
  const ppl=S.roster.filter(p=>p.house===win.id).map(p=>esc(shortName(p)));
  const el=document.getElementById('cert');

      <div class="cert-score">${n1(win.pts)} points${win.smg?' &middot; '+win.smg+' SMG responses':''}${win.extra?' &middot; '+win.extra+' extra':''}</div>
      <div class="cert-names">${ppl.join(' &nbsp;&middot;&nbsp; ')||'&nbsp;'}</div>

/* ---------- actions ---------- */
/* 11: Space/Enter on the role=checkbox divs */
function kbd(ev,fn){if(ev.key===' '||ev.key==='Enter'||ev.key==='Spacebar'){ev.preventDefault();fn()}}
function go(t){tab=t;render();window.scrollTo({top:0,behavior:'smooth'})}
function grabShiftInputs(){const o={};
  S.roster.forEach(p=>{
    const el=document.getElementById('ex-'+p.id);if(el&&el.value)o['ex-'+p.id]=el.value});
  ['pw','who2','mName','newName','newHouse','exLabel','exPts','tgLabel','tgSub','smgAdd','bkIn'].forEach(id=>{
    const el=document.getElementById(id);if(el&&el.value)o[id]=el.value});
  return o}
function putShiftInputs(o){Object.keys(o).forEach(k=>{
  const el=document.getElementById(k);if(el)el.value=o[k]})}
function extrasUsed(weekStart,houseId,name){
  const end=addDays(weekStart,6);
  return S.entries.filter(e=>(e.extra||0)>0&&e.date>=weekStart&&e.date<=end
    &&(!houseId||houseSlot(e.house)===houseId)&&(!name||e.name===name)).length}
/* A deduction is an ordinary entry with a negative `extra` — nothing new is
   stored, so merge, tombstones, undo and restore work untouched and older
   backups load unchanged. extrasUsed() filters on extra>0, so taking points
   does not eat into the deeds allowance. */
function deductsUsed(weekStart,houseId,name){
  const end=addDays(weekStart,6);
  return S.entries.filter(e=>(e.extra||0)<0&&e.date>=weekStart&&e.date<=end
    &&(!houseId||houseSlot(e.house)===houseId)&&(!name||e.name===name)).length}
function deductAllowance(date,houseId,name){
  const wk=mondayOf(date);
  return {house:Math.max(0,(S.maxDeductHouse||0)-deductsUsed(wk,houseId,null)),
          partner:Math.max(0,(S.maxDeductPartner||0)-deductsUsed(wk,null,name))}}
function setMd(id){mdDraft.mdId=id;render()}
/* the note gates the button, but re-rendering per keystroke would take the
   focus out of the field mid-sentence, so flip the button directly */
function setMdNote(el){
  mdDraft.detail=el.value;
  const b=document.getElementById('mdBtn');
  if(b)b.disabled=!(mdDraft.name&&mdDraft.mdId&&mdDraft.detail.trim())}
function takePoints(){
  if(!canEdit())return;
  const p=S.roster.find(x=>x.name===mdDraft.name);
  if(!p){mdDraft.name='';toast('That partner is no longer on the roll');render();return}
  const d=misdeedsList().find(x=>x.id===mdDraft.mdId);
  if(!d){toast('Choose what happened');return}
  if(!mdDraft.detail.trim()){toast('Say what happened — a deduction needs a note');return}
  const a=deductAllowance(mdDraft.date,p.house,p.name);
  if(a.partner<=0){toast(shortName(p)+' has already lost points this week');return}
  if(a.house<=0){toast(p.house+' has already lost points '+S.maxDeductHouse+' times this week');return}
  askConfirm('Take '+d.pts+' points from '+p.house+' for '+shortName(p)+'?',()=>{
    snap();
    S.entries.push({id:uid(),date:mdDraft.date,name:p.name,house:p.house,smg:0,tgt:0,
      extra:-d.pts,reason:d.label+' — '+mdDraft.detail.trim(),by:me.name});
    mdDraft={name:'',mdId:'',detail:'',date:todayISO()};
    save();render();toast(d.pts+' points from '+p.house,1)})}
function misdeedsEditor(){
  const rows=misdeedsList().map(x=>`<div class="wk" style="gap:6px">
    <input type="text" value="${esc(x.label)}" style="flex:1;padding:8px 9px;font-size:13.5px"
      onchange="setMisdeedCfg('${esc(x.id)}','label',this.value)" aria-label="Misdeed name">
    <input type="number" min="0" value="${x.pts}" style="flex:0 0 60px;padding:8px 4px;text-align:center;font-family:var(--mono)"
      onchange="setMisdeedCfg('${esc(x.id)}','pts',this.value)" aria-label="Points taken for ${esc(x.label)}">
    <button class="x" style="flex:0 0 26px" onclick="delMisdeed('${esc(x.id)}')" aria-label="Remove ${esc(x.label)}">×</button></div>`).join('');
  return `<h2 style="margin-top:28px">Points taken</h2>
  <p class="hint">The other side of the deeds list. Fixed amounts, the same for every house, so it never depends on who is asking. A house can lose points ${S.maxDeductHouse} times a week and nobody more than ${S.maxDeductPartner}. Changing this list never rewrites points already taken.</p>
  <div class="card" style="padding:10px 13px">${rows||'<span class="by">nothing here — points can only be taken for something on this list</span>'}</div>
  <div class="card"><div class="row">
    <input type="text" id="mdLabel" placeholder="New reason" onkeydown="if(event.key==='Enter')addMisdeed()">
    <input type="number" min="0" id="mdPts" placeholder="Pts" style="flex:0 0 70px"></div>
  <button class="btn ghost" style="margin-top:9px" onclick="addMisdeed()">Add reason</button></div>`}
function setMisdeedCfg(id,k,v){
  if(!canManage())return;
  const x=misdeedsList().find(y=>y.id===id);if(!x)return;
  if(k==='pts')x.pts=Math.max(0,Number(v)||0);else{const l=String(v).trim();if(!l)return;x.label=l}
  save();render()}
function delMisdeed(id){
  if(!canManage())return;
  const x=misdeedsList().find(y=>y.id===id);if(!x)return;
  askConfirm('Remove "'+x.label+'" from the list? Points already taken for it are kept.',()=>{
    S.misdeeds=misdeedsList().filter(y=>y.id!==id);save();render();toast('Removed')})}
function addMisdeed(){
  if(!canManage())return;
  const l=((document.getElementById('mdLabel')||{}).value||'').trim();
  const p=Math.max(0,Number((document.getElementById('mdPts')||{}).value)||0);
  if(!l){toast('Give the reason a name');return}
  if(!p){toast('Give it some points');return}
  if(!Array.isArray(S.misdeeds))S.misdeeds=[];
  S.misdeeds.push({id:uid(),label:l,pts:p});
  save();render();toast('"'+l+'" added at '+p+' points')}
function extrasEditor(){
  const rows=extrasList().map(x=>`<div class="wk" style="gap:6px">
    <input type="text" value="${esc(x.label)}" style="flex:1;padding:8px 9px;font-size:13.5px"
      onchange="setExtraCfg('${esc(x.id)}','label',this.value)" aria-label="Deed name">
    <input type="number" min="0" value="${x.pts}" style="flex:0 0 60px;padding:8px 4px;text-align:center;font-family:var(--mono)"
      onchange="setExtraCfg('${esc(x.id)}','pts',this.value)" aria-label="Points for ${esc(x.label)}">
    <button class="x" style="flex:0 0 26px" onclick="delExtra('${esc(x.id)}')" aria-label="Remove ${esc(x.label)}">×</button></div>`).join('');
  return `<h2 style="margin-top:28px">Deeds worth extra points</h2>
  <p class="hint">Your store's own list — every manager awards from it at the amounts you set. Changing it never rewrites points already given.</p>
  <div class="card" style="padding:10px 13px">${rows||'<span class="by">no deeds yet — add one below</span>'}</div>
  <div class="card"><div class="row">
    <input type="text" id="exLabel" placeholder="New deed" onkeydown="if(event.key==='Enter')addExtraDeed()">
    <input type="number" min="0" id="exPts" placeholder="Pts" style="flex:0 0 70px"></div>
  <button class="btn ghost" style="margin-top:9px" onclick="addExtraDeed()">Add deed</button></div>`}
function targetsEditor(){
  const rows=targetsList().map(t=>`<div class="wk" style="gap:6px">
    <input type="text" value="${esc(t.label)}" style="flex:1;padding:8px 9px;font-size:13.5px"
      onchange="setTargetCfg('${esc(t.k)}','label',this.value)" aria-label="Target name">
    <input type="text" value="${esc(t.sub||'')}" placeholder="detail" style="flex:0 0 122px;padding:8px 7px;font-size:12px"
      onchange="setTargetCfg('${esc(t.k)}','sub',this.value)" aria-label="Detail for ${esc(t.label)}">
    <button class="x" style="flex:0 0 26px" onclick="delTarget('${esc(t.k)}')" aria-label="Remove ${esc(t.label)}">×</button></div>`).join('');
  return `<h2 style="margin-top:28px">Store targets</h2>
  <p class="hint">The daily numbers each shift ticks — every hit earns Pts / store target for the whole crew. Changing this list never touches points already given.</p>
  <div class="card" style="padding:10px 13px">${rows||'<span class="by">no targets yet — add one below</span>'}</div>
  <div class="card"><div class="row">
    <input type="text" id="tgLabel" placeholder="New target" onkeydown="if(event.key==='Enter')addTarget()">
    <input type="text" id="tgSub" placeholder="Detail, e.g. £452 for the day" style="flex:0 0 148px"></div>
  <button class="btn ghost" style="margin-top:9px" onclick="addTarget()">Add target</button></div>`}
function setTargetCfg(k,f,v){
  if(!canManage())return;
  const t=(S.targets||[]).find(x=>x.k===k);if(!t)return;
  v=String(v).trim();
  if(f==='label'){if(!v){render();return}t.label=v}else t.sub=v;
  save();render()}
function delTarget(k){
  if(!canManage())return;
  const t=(S.targets||[]).find(x=>x.k===k);if(!t)return;
  askConfirm('Remove "'+t.label+'" from the store targets? Shifts already recorded keep their ticks, and points already given are never changed.',()=>{
    snap();S.targets=S.targets.filter(x=>x.k!==k);save();render();toast('Target removed',1)})}
function addTarget(){
  if(!canManage())return;
  const l=((document.getElementById('tgLabel')||{}).value||'').trim();
  const s=((document.getElementById('tgSub')||{}).value||'').trim();
  if(!l){toast('Give the target a name');return}
  if(!Array.isArray(S.targets))S.targets=[];
  S.targets.push({k:'t'+uid(),label:l,sub:s});
  save();render();toast('"'+l+'" added to the store targets')}
function setExtraCfg(id,k,v){
  if(!canManage())return;
  const x=(S.extras||[]).find(e=>e.id===id);if(!x)return;
  if(k==='pts')x.pts=Math.max(0,Number(v)||0);
  else{v=String(v).trim();if(!v){render();return}x.label=v}
  save();render()}
function delExtra(id){
  if(!canManage())return;
  const x=(S.extras||[]).find(e=>e.id===id);if(!x)return;
  askConfirm('Remove "'+x.label+'" from the deeds list? Points already awarded for it are kept.',()=>{
    snap();S.extras=S.extras.filter(e=>e.id!==id);save();render();toast('Deed removed',1)})}
function addSurveys(){
  if(!me)return;
  const el=document.getElementById('smgAdd'),n=Math.floor(Number(el&&el.value)||0);
  if(n<=0){toast('How many responses came in?');if(el)el.focus();return}
  snap();
  const before=S.smgCount||0;S.smgCount=before+n;
  save();render();
  if(!((S.smgTarget||0)>0&&before>=S.smgTarget)&&surveyReached())
    toast('Survey target reached — '+n1(S.smgReward||0)+' points to every house!',1);
  else toast(n+' response'+(n===1?'':'s')+' added — '+(S.smgCount)+' of '+S.smgTarget,1)}
function addExtraDeed(){
  if(!canManage())return;
  const l=((document.getElementById('exLabel')||{}).value||'').trim();
  const p=Math.max(0,Number((document.getElementById('exPts')||{}).value)||0);
  if(!l){toast('Give the deed a name');return}
  if(!p){toast('Give it some points');return}
  if(!Array.isArray(S.extras))S.extras=[];
  S.extras.push({id:uid(),label:l,pts:p});
  save();render();toast('"'+l+'" added at '+p+' points')}
function setCfg(k,v){S[k]=(typeof DEFAULT[k]==='number')?Math.max(0,Number(v)||0):v;
  if(k==='houseCount')syncHouses();
  save();render()}
function togglePC(){S.perCapita=!S.perCapita;save();render()}
function toggleT(k){const keep=grabShiftInputs();dayDraft[k]=!dayDraft[k];render();putShiftInputs(keep)}
function loadDayTicks(){
  const e=S.days.find(d=>d.date===dayDraft.date&&(d.shift||'')===dayDraft.shift);
  dayDraft.crew=e&&e.crew?e.crew.filter(id=>S.roster.some(p=>p.id===id)):[];
  targetsList().forEach(t=>dayDraft[t.k]=e?!!e[t.k]:false)}
function setDayDate(v){const keep=grabShiftInputs();dayDraft.date=v;loadDayTicks();render();putShiftInputs(keep)}
function setDayShift(s){const keep=grabShiftInputs();dayDraft.shift=s;loadDayTicks();render();putShiftInputs(keep)}
function toggleCrew(id){const keep=grabShiftInputs();
  const i=dayDraft.crew.indexOf(id);
  if(i>=0)dayDraft.crew.splice(i,1);else dayDraft.crew.push(id);
  render();putShiftInputs(keep)}
function crewAll(){const keep=grabShiftInputs();
  dayDraft.crew=S.roster.filter(p=>!p.left).map(p=>p.id);
  render();putShiftInputs(keep)}
function crewNone(){dayDraft.crew=[];render()}
function saveShift(){
  if(!me)return;
  const d=dayDraft.date,wk=mondayOf(d);
  const tHits=targetsList().filter(t=>dayDraft[t.k]).length;
  const adds=[];
  S.roster.forEach(p=>{
    if(p.left||!dayDraft.crew.includes(p.id))return;
    const x=extrasList().find(e=>e.id===((document.getElementById('ex-'+p.id)||{}).value||''));
    if(!x&&!tHits)return;
    adds.push({p,x})});
  const houseAdd={},partnerAdd={};
  adds.forEach(a=>{if(!a.x)return;
    houseAdd[a.p.house]=(houseAdd[a.p.house]||0)+1;
    partnerAdd[a.p.name]=(partnerAdd[a.p.name]||0)+1});
  for(const nm in partnerAdd)
    if(extrasUsed(wk,null,nm)+partnerAdd[nm]>S.maxExtraPartner){
      toast(nm+' would go over '+S.maxExtraPartner+' extras this week');return}
  for(const hId in houseAdd)
    if(extrasUsed(wk,hId,null)+houseAdd[hId]>S.maxExtraHouse){
      toast(hId+' would go over '+S.maxExtraHouse+' extras this week');return}
  snap();
  const i=S.days.findIndex(x=>x.date===d&&(x.shift||'')===dayDraft.shift);
  const rec={id:i>=0?S.days[i].id:uid(),date:d,shift:dayDraft.shift,crew:dayDraft.crew.slice(),by:me.name};
  targetsList().forEach(t=>rec[t.k]=!!dayDraft[t.k]);
  if(i>=0)S.days[i]=rec;else S.days.push(rec);
  let n=0,pts=0;const gains={};
  adds.forEach(a=>{
    const reason=[a.x?a.x.label:null,
      tHits?'shift hit '+tHits+' target'+(tHits===1?'':'s'):null].filter(Boolean).join(' · ');
    const e={id:uid(),date:d,name:a.p.name,house:a.p.house,smg:0,
      extra:a.x?a.x.pts:0,tgt:tHits,reason,by:me.name};
    S.entries.push(e);n++;pts+=entryPts(e);
    gains[a.p.house]=(gains[a.p.house]||0)+entryPts(e)});
  if(S.days.length===1&&S.entries.length===n)S.cupStart=d;
  save();render();
  const won=Object.keys(gains);
  won.forEach(h=>pour(h,gains[h]));
  if(won.length)window.scrollTo({top:0,behavior:reducedMotion()?'auto':'smooth'});
  toast(shiftName(rec.shift)+' recorded'
    +(n?' — '+pts+' pts across '+n+' partner'+(n===1?'':'s'):(tHits?' — targets tracked, no crew chosen':'')),1)}
function delEntry(id){if(!canEdit())return;
  const e=S.entries.find(x=>x.id===id);if(!e)return;
  askConfirm('Take back '+e.name+"'s points from "+fmtDate(e.date)+'?',()=>{
    snap();tomb([id]);S.entries=S.entries.filter(x=>x.id!==id);save();render();toast('Points taken back',1)})}
function smallestHouse(){const c={};HOUSES.forEach(h=>c[h.id]=S.roster.filter(p=>p.house===h.id).length);
  return HOUSES.slice().sort((a,b)=>c[a.id]-c[b.id])[0].id}
function addPartner(){
  const el=document.getElementById('newName'),name=el.value.trim();
  if(!name){el.focus();return}
  const dup=S.roster.find(p=>p.name.toLowerCase()===name.toLowerCase());
  if(dup){
    if(dup.left){dup.left=false;save();render();toast(dup.name+' is back on the team');return}
    toast('Already on the team');return}
  const chosen=((document.getElementById('newHouse')||{}).value)||'';
  const h=chosen||smallestHouse();
  S.roster.push({id:uid(),name,house:h});
  S.roster.sort((a,b)=>a.name.localeCompare(b.name));
  save();render();const n=document.getElementById('newName');if(n)n.focus();toast(name+' joins '+h)}
function delPartner(id){if(!canEdit())return;
  const p=S.roster.find(x=>x.id===id);if(!p)return;
  askConfirm('Remove '+p.name+' from the team?',()=>{
    snap();
    if(S.entries.some(e=>e.name===p.name)){
      p.left=true;
      save();render();toast(p.name+' removed — their points stay in the maths until term end',1)}
    else{
      tomb([id]);S.roster=S.roster.filter(x=>x.id!==id);
      save();render();toast(p.name+' removed',1)}})}
function toggleTill(id){
  const p=S.roster.find(x=>x.id===id);if(!p)return;
  p.till=!p.till;save();render()}
function setHouse(id,h){const p=S.roster.find(x=>x.id===id);if(p){p.house=h;save();render()}}
function sortHat(){
  if(!S.roster.length){toast('Nobody to sort yet');return}
  askConfirm('Let the Sorting Hat place everyone anew?',()=>{
  snap();
  /* 10: Fisher-Yates. sort(()=>Math.random()-.5) is not a uniform shuffle,
     and for a sorting hat even placement is the whole point. */
  const n=HOUSES.length,mix=a=>{const b=a.slice();
    for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=b[i];b[i]=b[j];b[j]=t}
    return b};
  let i=0;
  mix(S.roster.filter(p=>p.till)).forEach(p=>{p.house=HOUSES[i++%n].id});
  mix(S.roster.filter(p=>!p.till)).forEach(p=>{p.house=HOUSES[i++%n].id});
  S.roster.sort((a,b)=>a.name.localeCompare(b.name));
  save();render();toast('The hat has spoken',1)})}
function restoreBackup(){
  if(!canManage()){toast('Only the store manager can restore the board');return}
  const t=(document.getElementById('bkIn')||{}).value||'';
  if(!t.trim()){toast('Paste a backup first');return}
  let d;try{d=JSON.parse(t)}catch(e){toast('That does not look like a backup');return}
  if(!d||typeof d!=='object'||!('roster' in d)){toast('That does not look like a backup');return}
  askConfirm('Restore this backup? It replaces what is on the board now, for everyone.',()=>{
    snap();
    S=Object.assign(freshState(),d);
    me=null;syncHouses();save(1);render();toast('Backup restored',1)})}
function resetAll(){
  if(!canManage()){toast('Only the store manager can reset the board');return}
  askConfirm('Reset everything? Every partner, point, day, manager and password is wiped — for everyone using this board, not just you. This cannot be undone after the next change.',()=>{
  snap();
  const fresh=freshState();
  const reseeded=fresh.managers.map(x=>x.id).concat(fresh.roster.map(x=>x.id));
  const gone=[].concat(S.entries.map(x=>x.id),S.days.map(x=>x.id),S.roster.map(x=>x.id),
    S.managers.map(x=>x.id),(S.archive||[]).map(x=>x.id)).filter(id=>reseeded.indexOf(id)<0);
  S=fresh;tomb(gone);me=null;tab='hall';
  dayDraft={date:todayISO(),shift:(new Date().getHours()<15?'am':'pm'),crew:[]};
  syncHouses();save();render();toast('Everything reset',1)})}
function closeCup(){
  if(!S.entries.length&&!S.days.length){toast('Nothing recorded this term');return}
  askConfirm('End the term? Everything empties and the result is engraved.',()=>{
  snap();
  const st=houseStats();
  const results=HOUSES.map(h=>st[h.id]).sort((a,b)=>b.pts-a.pts).map(s=>({id:s.id,pts:s.pts,smg:s.smg}));
  S.archive.push({id:uid(),winner:results[0].id,start:S.cupStart,end:todayISO(),results});
  tomb(S.entries.map(e=>e.id).concat(S.days.map(d=>d.id),S.roster.filter(p=>p.left).map(p=>p.id)));
  S.roster=S.roster.filter(p=>!p.left);
  S.entries=[];S.days=[];S.smgCount=0;S.cupStart=todayISO();S.rotationDate='';
  save();tab='hall';render();toast(results[0].id+' wins the House Cup!',1)})}

setInterval(poll,20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
document.getElementById('storeName').onchange=e=>{if(!me)return;S.store=e.target.value.trim();save()};
load();
</script>
